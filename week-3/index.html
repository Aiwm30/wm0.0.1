<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>第九周：真实天气联动 + 性能优化</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; cursor: pointer; }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="info">正在获取天气数据...</div>

<script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
    }}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="module">
        // ============================================================
    // 项目：世界模型交互式 3D 场景
    // 功能：加载 AI 生成的椅子模型，支持材质切换、弹跳动画、HDRI 环境光照、天气联动
    // 版本：v0.9.0
    // 日期：2026-05-06
    // ============================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import Stats from 'three/addons/libs/stats.module.js';

// ========== 性能监视器初始化 ==========
const stats = new Stats();
stats.showPanel(0);
document.body.appendChild(stats.dom);
stats.dom.style.left = '20px';
stats.dom.style.top = '20px';
    // ========== 1. 场景初始化 ==========
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ========== 2. 灯光（基础补光，会根据天气动态调整） ==========
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // ========== 3. 地面 ==========
    scene.add(new THREE.GridHelper(4, 20, 0x444466, 0x222244));

    // ========== 4. 轨道控制 ==========
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, -0.3, 0);
    controls.update();

    // ========== 5. 材质风格预设 ==========
    const styles = [
        { name: '原木', color: 0xd4a574, roughness: 0.65, metalness: 0.05 },
        { name: '金属', color: 0xaaaabb, roughness: 0.25, metalness: 0.95 },
        { name: '塑料', color: 0xcc4444, roughness: 0.40, metalness: 0.00 },
        { name: '玻璃', color: 0x88ccff, roughness: 0.10, metalness: 0.10, transparent: true, opacity: 0.75 }
    ];
    let currentStyle = 0;
    let chairModel = null;

    function applyStyle(index) {
        const style = styles[index];
        if (!chairModel) return;
        chairModel.traverse(child => {
            if (child.isMesh) child.material = new THREE.MeshStandardMaterial(style);
        });
    }

    // ========== 6. HDRI 环境贴图 ==========
    new RGBELoader()
        .setPath('')
        .load('venice_sunset_1k.hdr', (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture;
            scene.background = texture;
            scene.backgroundBlurriness = 0.3;
        });

    // ========== 7. Draco + 模型加载 ==========
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    dracoLoader.preload();
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load(
        './chair-compressed.glb',
        (gltf) => {
            chairModel = gltf.scene;
            chairModel.position.set(0, -0.5, 0);
            applyStyle(0);
            scene.add(chairModel);
            fetchWeather(); // ★ 模型加载完成后，立即获取天气
        },
        (p) => { if (p.total) document.getElementById('info').textContent = `📦 加载中... ${(p.loaded / p.total * 100).toFixed(1)}%`; },
        (e) => console.error('❌ 加载失败:', e)
    );

    // ========== 8. 弹跳动画 ==========
    let isAnimating = false;
    function bounceChair() {
        if (!chairModel || isAnimating) return;
        isAnimating = true;
        const baseY = -0.5;
        gsap.to(chairModel.position, {
            y: baseY + 1.0, duration: 0.3, ease: "power2.out",
            onComplete: () => {
                gsap.to(chairModel.position, {
                    y: baseY, duration: 0.4, ease: "bounce.out",
                    onComplete: () => { isAnimating = false; }
                });
            }
        });
    }

    // ========== 9. 点击交互 ==========
    window.addEventListener('click', (event) => {
        if (!chairModel || event.target.tagName !== 'CANVAS') return;
        currentStyle = (currentStyle + 1) % styles.length;
        applyStyle(currentStyle);
        bounceChair();
    });

    // ========== 10. 天气数据获取与场景联动 ★★★ 本周核心 ★★★ ==========
    async function fetchWeather() {
        // ★ 请将下面的经纬度改为你的真实坐标
        const lat = 26.6;   // ← 你的纬度
        const lng = 106.71;  // ← 你的经度
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const weatherCode = data.current_weather.weathercode;
            const temp = data.current_weather.temperature;
            applyWeatherEffect(weatherCode, temp);
        } catch (error) {
            console.error('天气获取失败，使用默认场景:', error);
            document.getElementById('info').textContent = '⚠️ 天气数据获取失败，使用默认场景';
        }
    }

    // ========== 11. 天气效果映射 ==========
    function applyWeatherEffect(code, temp) {
        // 清空旧粒子
        if (window.weatherParticles) {
            scene.remove(window.weatherParticles);
            window.weatherParticles = null;
        }

        let weatherText = '';
        let exposure = 1.0;
        let ambientColor = 0xffffff;
        let ambientIntensity = 0.4;

        if (code === 0) { // 晴朗
            ambientColor = 0xffeedd;   // 暖黄色
            ambientIntensity = 0.7;
            exposure = 1.4;
            dirLight.color.set(0xffdd99);
            dirLight.intensity = 1.5;
            weatherText = `☀️ 晴朗 ${temp}°C`;
        } else if (code >= 1 && code <= 3) { // 多云
            ambientColor = 0xccddee;   // 冷白色
            ambientIntensity = 0.5;
            exposure = 0.9;
            dirLight.color.set(0xffffff);
            dirLight.intensity = 0.6;
            weatherText = `⛅ 多云 ${temp}°C`;
        } else if (code === 45 || code === 48) { // 雾/霜
            scene.fog = new THREE.Fog(0xcccccc, 1, 15);
            weatherText = `🌫️ 雾天 ${temp}°C`;
        } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) { // 雨
            ambientColor = 0x8899bb;
            ambientIntensity = 0.4;
            exposure = 0.7;
            dirLight.intensity = 0.3;
            createParticles('rain');
            weatherText = `🌧️ 雨天 ${temp}°C`;
        } else if (code >= 71 && code <= 77) { // 雪
            ambientColor = 0xddeeff;
            ambientIntensity = 0.5;
            exposure = 0.8;
            createParticles('snow');
            weatherText = `❄️ 雪天 ${temp}°C`;
        } else if (code === 95 || code === 96 || code === 99) { // 雷暴
            ambientColor = 0x556688;
            ambientIntensity = 0.3;
            exposure = 0.5;
            dirLight.intensity = 0.2;
            createParticles('rain');
            weatherText = `⛈️ 雷暴 ${temp}°C`;
            // 闪电效果见性能优化提示
        } else {
            weatherText = `🌤️ 当前 ${temp}°C (code:${code})`;
        }

        // 应用环境光
        ambientLight.color.set(ambientColor);
        ambientLight.intensity = ambientIntensity;
        renderer.toneMappingExposure = exposure;
        // 非雾天清除雾效
        if (code !== 45 && code !== 48) scene.fog = null;

        document.getElementById('info').textContent = weatherText;
    }

    // ========== 12. 粒子系统（雨/雪） ==========
    function createParticles(type) {
        const particleCount = type === 'rain' ? 1000 : 500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 8;     // x: -4 ~ 4
            positions[i+1] = Math.random() * 6;           // y: 0 ~ 6
            positions[i+2] = (Math.random() - 0.5) * 8;   // z: -4 ~ 4
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: type === 'rain' ? 0xaaccff : 0xffffff,
            size: type === 'rain' ? 0.03 : 0.08,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        particles.userData = { type, speed: type === 'rain' ? 0.08 : 0.02 };
        scene.add(particles);
        window.weatherParticles = particles;
    }

    // 动画循环中更新粒子位置
    function updateParticles() {
        if (!window.weatherParticles) return;
        const particles = window.weatherParticles;
        const positions = particles.geometry.attributes.position.array;
        const speed = particles.userData.speed;

        for (let i = 0; i < positions.length; i += 3) {
            positions[i+1] -= speed; // 向下移动
            if (positions[i+1] < -0.5) {
                positions[i+1] = 5.5;  // 重置到顶部
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;
    }

    // ========== 13. 动画循环 ==========
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        updateParticles(); // ★ 更新雨/雪粒子位置
        stats.update(); // ★ 更新性能监视器
        renderer.render(scene, camera);
    }
    animate();

    // ========== 14. 窗口自适应 ==========
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
