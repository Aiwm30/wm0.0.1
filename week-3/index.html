<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第六周：HDRI环境贴图与Draco压缩加载</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; cursor: pointer; }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="info">正在加载模型和HDRI环境...</div>

<!-- importmap -->
<script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
    }}
</script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // ========== 1. 场景初始化 ==========
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ========== 2. 灯光（HDRI 负责环境光，这里只留微弱补光） ==========
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    // ========== 3. 网格地面 ==========
    scene.add(new THREE.GridHelper(4, 20, 0x444466, 0x222244));

    // ========== 4. 轨道控制 ==========
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, -0.3, 0);
    controls.update();

    // ========== 5. 材质风格预设 ==========
    const styles = [
        { name: '原木', color: 0xd4a574, roughness: 0.65, metalness: 0.05 },
        { name: '金属', color: 0xaaaabb, roughness: 0.25, metalness: 0.95 },
        { name: '塑料', color: 0xcc4444, roughness: 0.40, metalness: 0.00 },
        { name: '玻璃', color: 0x88ccff, roughness: 0.10, metalness: 0.10, transparent: true, opacity: 0.75 }
    ];
    let currentStyle = 0;
    let chairModel = null;

    function applyStyle(index) {
        const style = styles[index];
        if (!chairModel) return;
        chairModel.traverse(child => {
            if (child.isMesh) child.material = new THREE.MeshStandardMaterial(style);
        });
        document.getElementById('info').textContent = `🏛️ 当前风格：${style.name} | 点击切换`;
    }

    // ========== 6. 加载 HDRI 环境贴图 ==========
    new RGBELoader()
        .setPath('')
        .load('venice_sunset_1k.hdr', (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture;
            scene.background = texture;
            scene.backgroundBlurriness = 0.3;
            document.getElementById('info').textContent = '✅ HDRI环境已加载！正在加载模型...';
        });

    // ========== 7. 配置 Draco 解码器 ==========
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    dracoLoader.preload();

    // ========== 8. 加载压缩模型（使用 DRACOLoader） ==========
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);   // ★ 把 Draco 解压器交给加载器

    loader.load(
        './chair-compressed.glb',        // ★ 这是我们压缩过的模型
        (gltf) => {
            chairModel = gltf.scene;
            chairModel.position.set(0, -0.5, 0);
            applyStyle(0);
            scene.add(chairModel);
            document.getElementById('info').textContent = '🎨 点击椅子切换材质！';
        },
        (p) => {
            if (p.total) document.getElementById('info').textContent = `📦 加载中... ${(p.loaded / p.total * 100).toFixed(1)}%`;
        },
        (e) => {
            document.getElementById('info').textContent = '❌ 模型加载失败！';
            console.error('❌ 加载失败:', e);
        }
    );

    // ========== 9. 弹跳动画（GSAP） ==========
    let isAnimating = false;
    function bounceChair() {
        if (!chairModel || isAnimating) return;
        isAnimating = true;
        const baseY = -0.5;
        gsap.to(chairModel.position, {
            y: baseY + 1.0,
            duration: 0.3,
            ease: "power2.out",
            onComplete: () => {
                gsap.to(chairModel.position, {
                    y: baseY,
                    duration: 0.4,
                    ease: "bounce.out",
                    onComplete: () => { isAnimating = false; }
                });
            }
        });
    }

    // ========== 10. 点击切换材质 + 弹跳 ==========
    window.addEventListener('click', (event) => {
        if (!chairModel || event.target.tagName !== 'CANVAS') return;
        currentStyle = (currentStyle + 1) % styles.length;
        applyStyle(currentStyle);
        bounceChair();
    });

    // ========== 11. 动画循环 ==========
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ========== 12. 响应窗口大小变化 ==========
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
