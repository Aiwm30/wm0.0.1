<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第五周：弹跳动画</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; cursor: pointer; }
    </style>
</head>
<body>

<script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
    }}
</script>

<!-- ============================================================
     GSAP：业界最强的 JavaScript 动画库
     通俗比喻：给你的代码装上一个弹簧马达，能让任何数值平滑变化
     ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. 三大核心
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 2. 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 5); scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x4488cc, 0.4);
    fillLight.position.set(-3, 1, -3); scene.add(fillLight);

    // 3. 网格地面
    scene.add(new THREE.GridHelper(4, 20, 0x444466, 0x222244));

    // 4. 轨道控制器
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, -0.3, 0);
    controls.update();

    // 5. 材质预设
    const styles = [
        { name: '原木', color: 0xd4a574, roughness: 0.65, metalness: 0.05 },
        { name: '金属', color: 0xaaaabb, roughness: 0.25, metalness: 0.95 },
        { name: '塑料', color: 0xcc4444, roughness: 0.40, metalness: 0.00 },
        { name: '玻璃', color: 0x88ccff, roughness: 0.10, metalness: 0.10, transparent: true, opacity: 0.75 }
    ];

    // 6. 加载模型
    const loader = new GLTFLoader();
    let chairModel = null;
    let currentStyle = 0;
    let isAnimating = false; // 防连点标志位

    loader.load(
        './chair.glb',
        (gltf) => {
            chairModel = gltf.scene;
            // 记住：椅子的原始 Y 位置是整个弹跳动画的基准线
            chairModel.position.set(0, -0.5, 0);
            applyStyle(0);
            scene.add(chairModel);
            console.log('✅ 椅子已加载，点击让它跳起来！');
        },
        (p) => { if (p.total) console.log(`📦 ${(p.loaded / p.total * 100).toFixed(1)}%`); },
        (e) => console.error('❌ 加载失败:', e)
    );

    // 应用材质风格
    function applyStyle(index) {
        const style = styles[index];
        if (!chairModel) return;
        chairModel.traverse(child => {
            if (child.isMesh) child.material = new THREE.MeshStandardMaterial(style);
        });
        document.title = `椅子风格：${style.name}`;
    }

    // 7. 弹跳动画函数
    function bounceChair() {
        if (!chairModel || isAnimating) return;
        // isAnimating：正在动画中，防止用户狂点时动画乱跳

        isAnimating = true; // 锁定
        const baseY = -0.5; // 原始地面高度

        // gsap.to()：把物体的某个属性从当前值平滑过渡到目标值
        // 参数1：目标对象（椅子的位置）
        // 参数2：动画时长（秒）
        // 参数3：配置项
        gsap.to(chairModel.position, {
            y: baseY + 1.0,   // 先跳到上方 1 个单位
            duration: 0.3,    // 持续时间 0.3 秒
            ease: "power2.out", // 缓动函数：先快后慢
            onComplete: () => {
                // 到达最高点后，立刻落回原位
                gsap.to(chairModel.position, {
                    y: baseY,
                    duration: 0.4,
                    ease: "bounce.out", // bounce.out：弹跳缓动，落下时会产生弹簧般的回弹
                    onComplete: () => {
                        isAnimating = false; // 动画全部完成，解锁
                    }
                });
            }
        });
    }

    // 8. 点击事件：切换材质 + 触发弹跳
    window.addEventListener('click', (event) => {
        if (!chairModel) return;

        // 防止点到按钮等 UI 元素
        if (event.target.tagName !== 'CANVAS') return;

        currentStyle = (currentStyle + 1) % styles.length;
        applyStyle(currentStyle);
        bounceChair(); // 就是这个！
    });

    // 9. 动画循环
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // 10. 窗口自适应
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
